<script>
  function togglePinState(button) {
    const icon = button.querySelector('.material-symbols-outlined');
    const isPinned = button.classList.contains('bg-primary-fixed');
    if (isPinned) {
      button.classList.remove('bg-primary-fixed', 'text-primary');
      button.classList.add('text-on-surface-variant', 'hover:bg-surface-container');
      icon.style.fontVariationSettings = "'FILL' 0";
    } else {
      button.classList.add('bg-primary-fixed', 'text-primary');
      button.classList.remove('text-on-surface-variant', 'hover:bg-surface-container');
      icon.style.fontVariationSettings = "'FILL' 1";
    }
  }

  function toggleActionMenu() {
    const menu = document.getElementById('overflow-menu-panel');
    menu.classList.toggle('hidden');
    menu.classList.toggle('flex');
  }

  document.addEventListener('click', function(e) {
    const trigger = document.getElementById('btn-menu-trigger');
    const menu = document.getElementById('overflow-menu-panel');
    if (menu && !menu.contains(e.target) && !trigger.contains(e.target)) {
      menu.classList.add('hidden');
      menu.classList.remove('flex');
    }
  });

  function updateCharStats() {
    const body = document.getElementById('note-body-textarea').value;
    const words = body.trim() ? body.trim().split(/\s+/).length : 0;
    const chars = body.length;
    const display = document.getElementById('note-stats-display');
    if (display) {
      display.innerHTML = `<span>${words} kata</span><span>${chars} karakter</span>`;
    }
  }

  function convertToFormat(format) {
    if (format === 'checklist') {
      const textarea = document.getElementById('note-body-textarea');
      const lines = textarea.value.split('\n').filter(line => line.trim().length > 0);
      const converted = lines.map(line => {
        const cleaned = line.replace(/^\d+[\.\)]\s*/, '').replace(/^[-*•]\s*/, '');
        return `[ ] ${cleaned}`;
      }).join('\n');
      textarea.value = converted;
      toggleActionMenu();
      updateCharStats();
    }
  }

  function copyNoteText() {
    const title = document.getElementById('note-title-input').value;
    const body = document.getElementById('note-body-textarea').value;
    const fullText = `${title}\n\n${body}`;
    navigator.clipboard?.writeText(fullText).then(() => {
      toggleActionMenu();
    });
  }

  function confirmDeleteNote() {
    if (confirm('Pindahkan catatan ini ke Sampah?')) {
      history.back();
    }
  }

  function openLabelSheet() {
    document.getElementById('label-modal').classList.remove('hidden');
    const menu = document.getElementById('overflow-menu-panel');
    if (menu) menu.classList.add('hidden');
  }

  function closeLabelSheet() {
    document.getElementById('label-modal').classList.add('hidden');
  }

  function triggerDrivePicker() {
    alert('Membuka browser berkas SpaceBridge Google Drive...');
  }

  function triggerCamera() {
    alert('Buka pemilih galeri atau kamera dokumen...');
  }

  // Initial calculation on render
  updateCharStats();
</script></main>
