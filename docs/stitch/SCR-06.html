<script>
  function triggerAction(actionType) {
    if (window.navigator && window.navigator.vibrate) {
      window.navigator.vibrate(20);
    }
    const message = actionType === 'catatan' ? 'Membuka editor catatan baru...' :
                    actionType === 'tugas' ? 'Menyiapkan lembar checklist...' :
                    'Menghubungkan berkas ke Google Drive...';
    console.log(message);
    setTimeout(() => {
      window.location.hash = '#' + actionType;
    }, 150);
  }
