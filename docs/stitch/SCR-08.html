<div class="w-9 h-9 rounded-lg bg-surface-container flex items-center justify-center shrink-0 text-on-surface">
<span class="material-symbols-outlined text-[22px]">visibility</span>
</div>
<div class="flex-1 min-w-0">
<span class="block font-title text-body-lg font-semibold text-on-surface leading-tight">Buka Berkas</span>
<span class="block font-body-sm text-body-sm text-on-surface-variant line-clamp-1">Buka salinan cepat di penampil dokumen Android</span>
</div>

</button>

<div class="w-9 h-9 rounded-lg bg-surface-container flex items-center justify-center shrink-0 text-primary">

</div>

<!-- Toast Feedback Element -->
<div class="fixed bottom-6 left-4 right-4 z-50 transform translate-y-24 opacity-0 transition-all duration-300 pointer-events-none flex items-center gap-space-sm px-space-md py-3 rounded-xl bg-inverse-surface text-inverse-on-surface shadow-lg" id="actionToast">
<span class="material-symbols-outlined text-[20px] text-tertiary-fixed" id="toastIcon">check_circle</span>
<span class="font-body-md text-body-md flex-1" id="toastMsg">Aksi berhasil diproses</span>
</div>
</div>
<script>
  function triggerFileAction(actionType) {
    const toast = document.getElementById('actionToast');
    const toastMsg = document.getElementById('toastMsg');
    const toastIcon = document.getElementById('toastIcon');

    const feedbackMap = {
      preview: { msg: 'Membuka dokumen di Android viewer...', icon: 'visibility' },
      open_drive: { msg: 'Mengarahkan ke Google Drive...', icon: 'open_in_new' },
      download: { msg: 'Mengunduh salinan ke folder Download...', icon: 'downloading' },
      rename: { msg: 'Mempersiapkan dialog ganti nama...', icon: 'edit' },
      share: { msg: 'Tautan berhasil disalin ke papan klip!', icon: 'link' },
      delete: { msg: 'Dipindahkan ke folder Sampah', icon: 'delete' }
    };

    const config = feedbackMap[actionType] || { msg: 'Memproses tindakan...', icon: 'sync' };
    toastMsg.textContent = config.msg;
    toastIcon.textContent = config.icon;

    toast.classList.remove('translate-y-24', 'opacity-0');
    toast.classList.add('translate-y-0', 'opacity-100');

    setTimeout(() => {
      toast.classList.remove('translate-y-0', 'opacity-100');
      toast.classList.add('translate-y-24', 'opacity-0');
      if (actionType === 'delete') {
        setTimeout(() => history.back(), 500);
      }
    }, 2000);
  }
</script></main></div></body></html>
